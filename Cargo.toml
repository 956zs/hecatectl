[workspace]
resolver = "2"
members = ["crates/hecate-core", "crates/hecatectl"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
hecate-core = { path = "crates/hecate-core" }
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
